<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b91c1c">
<title>Baixa de Entrega</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="html5-qrcode.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:#111827;max-width:520px;margin:0 auto}
  .tela{display:none;min-height:100vh;flex-direction:column}
  .tela.ativa{display:flex}
  .top{background:#b91c1c;color:#fff;padding:14px 16px}
  .top b{font-size:17px;display:block}
  .top small{font-size:12px;opacity:.9}
  .top .sair{float:right;color:#fff;font-size:12px;text-decoration:underline;opacity:.9;background:none;border:0}
  .corpo{padding:16px;flex:1;display:flex;flex-direction:column;gap:10px}
  .lbl{font-size:13px;color:#4b5563;font-weight:600}
  input.inp{border:1.5px solid #d1d5db;border-radius:10px;padding:13px 12px;font-size:16px;width:100%;outline:none}
  input.inp:focus{border-color:#b91c1c}
  .btn{background:#b91c1c;color:#fff;border:0;border-radius:12px;padding:15px;text-align:center;font-weight:700;font-size:16px;width:100%}
  .btn:disabled{opacity:.5}
  .btn.sec{background:#fff;color:#b91c1c;border:1.5px solid #b91c1c}
  .logo{width:72px;height:72px;border-radius:20px;background:#fee2e2;margin:36px auto 6px;display:flex;align-items:center;justify-content:center}
  .c{text-align:center}
  .muted{font-size:12px;color:#6b7280;text-align:center}
  .erro{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;border-radius:10px;padding:10px 12px;font-size:13px;display:none}
  .aviso{background:#fffbeb;color:#92400e;border:1px solid #fde68a;border-radius:10px;padding:10px 12px;font-size:13px;display:none}
  /* scanner */
  .cam{background:#1f2937;flex:1;display:flex;flex-direction:column;align-items:center;padding:16px;gap:12px}
  .cam p{color:#fff;font-size:14px;text-align:center}
  #reader{width:100%;max-width:420px;border-radius:12px;overflow:hidden;background:#111}
  #reader{position:relative}
  #reader video{border-radius:12px}
  .mira{position:absolute;left:5%;right:5%;top:30%;bottom:30%;border:3px solid rgba(255,255,255,.9);border-radius:10px;box-shadow:0 0 0 2000px rgba(0,0,0,.25);pointer-events:none}
  .mira::after{content:'';position:absolute;left:4%;right:4%;top:50%;height:2px;background:#ef4444;box-shadow:0 0 8px #ef4444}
  .ferr{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .pill{background:rgba(255,255,255,.15);color:#fff;font-size:14px;border-radius:22px;padding:10px 16px;border:0}
  .manual{display:none;width:100%;max-width:420px;gap:8px;flex-direction:column}
  .manual input{font-size:15px}
  /* ocorrências */
  .srch{display:flex;align-items:center;gap:8px;border:2px solid #b91c1c;border-radius:10px;padding:0 10px}
  .srch input{border:0;outline:none;font-size:16px;padding:12px 0;flex:1;min-width:0}
  .srch button{background:none;border:0;color:#9ca3af;font-size:16px;padding:6px}
  .cnt{font-size:12px;color:#6b7280}
  .lista{display:flex;flex-direction:column;gap:6px;overflow-y:auto;flex:1;min-height:180px;max-height:46vh;padding-bottom:4px}
  .oc{display:flex;align-items:center;gap:10px;border:1.5px solid #e5e7eb;border-radius:10px;padding:9px 10px;background:#fff;text-align:left;width:100%}
  .oc .r{width:18px;height:18px;border-radius:50%;border:2px solid #9ca3af;flex:none}
  .oc .cd{background:#f3f4f6;font-weight:700;font-size:13px;border-radius:6px;padding:3px 7px;flex:none}
  .oc .ds{font-size:13px;line-height:1.25}
  .oc.sel{border-color:#b91c1c;background:#fef2f2}
  .oc.sel .r{border:6px solid #b91c1c}
  .oc.sel .cd{background:#b91c1c;color:#fff}
  .oc.sel .ds{font-weight:700}
  .vazio{font-size:13px;color:#6b7280;text-align:center;padding:20px}
  .tag{background:#fff;color:#166534;border-radius:8px;padding:1px 6px;font-weight:700;font-size:11px}
  /* fim */
  .big{width:104px;height:104px;border-radius:50%;margin:30px auto 10px;display:flex;align-items:center;justify-content:center}
  .card{background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;padding:11px 13px}
  .card .k{font-size:12px;color:#6b7280}
  .card .v{font-size:15px;font-weight:600}
  .ok{display:inline-block;font-size:11px;font-weight:700;border-radius:10px;padding:2px 8px}
  .carregando{position:fixed;inset:0;background:rgba(255,255,255,.7);display:none;align-items:center;justify-content:center;font-weight:600;z-index:9}
</style>
</head>
<body>

<!-- ============ TELA 1: LOGIN ============ -->
<section id="t-login" class="tela">
  <div class="corpo">
    <div class="logo"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#b91c1c" stroke-width="2"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg></div>
    <div class="c" style="font-size:21px;font-weight:700">Baixa de Entrega</div>
    <div class="muted" style="margin-bottom:16px">Acesso do motorista</div>
    <div class="lbl">CPF</div>
    <input id="cpf" class="inp" inputmode="numeric" autocomplete="username" placeholder="000.000.000-00" maxlength="14">
    <div class="lbl">Senha</div>
    <input id="senha" class="inp" type="password" autocomplete="current-password" placeholder="••••••••">
    <div id="login-erro" class="erro"></div>
    <div style="flex:1;min-height:24px"></div>
    <button id="btn-entrar" class="btn">Entrar</button>
    <div class="muted">Esqueceu a senha? Fale com seu supervisor</div>
  </div>
</section>

<!-- ============ TELA 2: LEITURA ============ -->
<section id="t-scan" class="tela">
  <div class="top"><button class="sair" id="btn-sair">sair</button><b id="ola">Olá</b><small id="resumo">—</small></div>
  <div class="cam">
    <p>Aponte para o código de barras do DACTE, deixando ele dentro da moldura</p>
    <div id="reader"></div>
    <div id="diag" style="color:#9ca3af;font-size:11px;margin-top:-6px"></div>
    <div id="scan-erro" class="erro" style="width:100%;max-width:420px"></div>
    <div class="ferr">
      <button class="pill" id="btn-lanterna">🔦 Lanterna</button>
      <button class="pill" id="btn-trocar" style="display:none">🔄 Trocar câmera</button>
      <button class="pill" id="btn-foto">📷 Usar foto</button>
      <button class="pill" id="btn-digitar">⌨ Digitar chave</button>
    </div>
    <div id="leitor-oculto" style="display:none"></div>
    <input type="file" id="arq-foto" accept="image/*" capture="environment" style="display:none">
    <div class="manual" id="manual">
      <input id="chave-manual" class="inp" inputmode="numeric" maxlength="54" placeholder="Digite os 44 números da chave">
      <button class="btn" id="btn-usar-chave">Continuar</button>
    </div>
  </div>
</section>

<!-- ============ TELA 3: OCORRÊNCIA ============ -->
<section id="t-oco" class="tela">
  <div class="top"><b id="cte-titulo">CT-e</b><small id="cte-sub"></small></div>
  <div class="corpo" style="gap:8px">
    <div id="dup-aviso" class="aviso"></div>
    <div class="lbl">Qual ocorrência melhor descreve esta baixa?</div>
    <div class="srch">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="busca" placeholder="Buscar por nome ou número" autocomplete="off">
      <button id="btn-limpar" aria-label="Limpar">✕</button>
    </div>
    <div class="cnt" id="cnt"></div>
    <div class="lista" id="lista"></div>
    <input id="recebedor" class="inp" placeholder="Recebedor (opcional)" maxlength="120" style="font-size:15px;padding:11px 12px">
    <div id="oco-erro" class="erro"></div>
    <button id="btn-enviar" class="btn" disabled>Enviar baixa</button>
    <button id="btn-cancelar" class="btn sec" style="padding:11px">Cancelar</button>
  </div>
</section>

<!-- ============ TELA 4: ENVIADO ============ -->
<section id="t-fim" class="tela">
  <div class="corpo">
    <div class="big" id="fim-icone"></div>
    <div class="c" style="font-size:22px;font-weight:700" id="fim-titulo">Baixa enviada!</div>
    <div class="muted" style="font-size:14px;margin-bottom:10px" id="fim-sub"></div>
    <div class="card"><div class="k">CT-e</div><div class="v" id="fim-cte"></div></div>
    <div class="card"><div class="k">Ocorrência</div><div class="v" id="fim-oco"></div></div>
    <div class="card"><div class="k">Status</div><div class="v" id="fim-status"></div></div>
    <div style="flex:1;min-height:20px"></div>
    <button class="btn" id="btn-proximo">Escanear próximo CT-e</button>
  </div>
</section>

<div class="carregando" id="carregando">Aguarde…</div>

<script>
/* ===================== ESTADO ===================== */
const K = { TOKEN: 'erv_token', NOME: 'erv_nome', OCO: 'erv_ocorrencias', FILA: 'erv_fila' };
const ls = {
  get(k, def) { try { const v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
let token = ls.get(K.TOKEN, null);
let ocorrencias = ls.get(K.OCO, []);
let cteAtual = null;          // dados da chave lida
let ocoSelecionada = null;
let gpsAtual = null;
let scanner = null, scannerRodando = false, lanterna = false;
let enviadasHoje = 0;

const $ = (id) => document.getElementById(id);

/* ===================== CHAMADAS AO SERVIDOR ===================== */
// URL da implantação do Apps Script (Implantar > Gerenciar implantações > URL do app da Web)
const API_URL = 'https://script.google.com/macros/s/AKfycbwTCAhDAZZPekGcWNOG2ItlbeeCGp069Pr76a0wN5VVBam0MpeZ14PSedUE2zFVR9KY/exec';

async function api(acao, ...args) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 25000);
  let resp;
  try {
    // text/plain evita a verificação prévia de CORS; o Apps Script lê o JSON do corpo
    resp = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ acao, args }),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', signal: ctrl.signal });
  } catch (e) {
    throw new Error('NetworkError: ' + (e.name === 'AbortError' ? 'timeout' : e.message));
  } finally { clearTimeout(t); }
  let dados;
  try { dados = await resp.json(); } catch (e) { throw new Error('NetworkError: resposta inválida do servidor'); }
  if (!dados.ok) throw new Error(dados.erro || 'Erro no servidor');
  return dados.resultado;
}
const erroDeRede = (e) => !navigator.onLine || /NetworkError|network|HTTP 0|Failed to fetch|timeout/i.test(String(e && e.message || e));

/* ===================== NAVEGAÇÃO ===================== */
function mostrar(id) {
  document.querySelectorAll('.tela').forEach(t => t.classList.remove('ativa'));
  $(id).classList.add('ativa');
  window.scrollTo(0, 0);
  if (id === 't-scan') iniciarCamera(); else pararCamera();
}
function carregando(on) { $('carregando').style.display = on ? 'flex' : 'none'; }
function erro(id, msg) { const el = $(id); el.textContent = msg || ''; el.style.display = msg ? 'block' : 'none'; }

/* ===================== VALIDAÇÃO DA CHAVE (igual ao servidor) ===================== */
const UFS = ['11','12','13','14','15','16','17','21','22','23','24','25','26','27','28','29','31','32','33','35','41','42','43','50','51','52','53'];
function extrairChave(lido) {
  const m = String(lido).match(/chCTe=(\d{44})/i);
  if (m) return m[1];
  const n = String(lido).replace(/\D/g, '');
  return n.length === 44 ? n : null;
}
function validarChave(ch) {
  if (!/^\d{44}$/.test(ch)) return { ok: false, erro: 'A chave deve ter 44 dígitos.' };
  let peso = 2, soma = 0;
  for (let i = 42; i >= 0; i--) { soma += Number(ch[i]) * peso; peso = peso === 9 ? 2 : peso + 1; }
  const resto = soma % 11, dv = resto < 2 ? 0 : 11 - resto;
  if (dv !== Number(ch[43])) return { ok: false, erro: 'Dígito verificador inválido. Leia novamente.' };
  if (UFS.indexOf(ch.slice(0, 2)) < 0) return { ok: false, erro: 'UF da chave inválida.' };
  const modelo = ch.slice(20, 22);
  if (modelo === '55') return { ok: false, erro: 'Este código é de uma NF-e (DANFE). Leia o código do DACTE.' };
  if (modelo !== '57' && modelo !== '67') return { ok: false, erro: 'Este código não é de um CT-e.' };
  return { ok: true, chave: ch, serie: Number(ch.slice(22, 25)), numero: ch.slice(25, 34), mes: ch.slice(4, 6) + '/20' + ch.slice(2, 4) };
}

/* ===================== LOGIN ===================== */
$('cpf').addEventListener('input', (e) => {
  const n = e.target.value.replace(/\D/g, '').slice(0, 11);
  e.target.value = n.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
});
$('senha').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btn-entrar').click(); });
$('btn-entrar').onclick = async () => {
  erro('login-erro');
  const cpf = $('cpf').value.replace(/\D/g, ''), senha = $('senha').value;
  if (cpf.length !== 11 || !senha) return erro('login-erro', 'Informe CPF e senha.');
  carregando(true);
  try {
    const r = await api('login', cpf, senha);
    token = r.token; ls.set(K.TOKEN, token); ls.set(K.NOME, r.nome);
    $('senha').value = '';
    await carregarOcorrencias();
    await atualizarResumo();
    mostrar('t-scan');
    sincronizar();
  } catch (e) {
    erro('login-erro', erroDeRede(e) ? 'Sem internet. O primeiro acesso precisa de conexão.' : e.message);
  } finally { carregando(false); }
};
$('btn-sair').onclick = async () => {
  if (fila().length && !confirm('Há baixas ainda não enviadas. Sair mesmo assim? Elas continuarão salvas neste aparelho.')) return;
  try { await api('logout', token); } catch (e) {}
  token = null; ls.del(K.TOKEN); mostrar('t-login');
};

function sessaoExpirada() {
  token = null; ls.del(K.TOKEN);
  erro('login-erro', 'Sua sessão expirou. Entre novamente — as baixas pendentes continuam salvas.');
  mostrar('t-login');
}

async function carregarOcorrencias() {
  try {
    ocorrencias = await api('listarOcorrencias', token);
    ls.set(K.OCO, ocorrencias);
  } catch (e) {
    if (String(e.message).indexOf('SESSAO_EXPIRADA') >= 0) return sessaoExpirada();
    // sem internet: usa a lista guardada no aparelho
  }
}

async function atualizarResumo() {
  const nome = ls.get(K.NOME, '');
  $('ola').textContent = 'Olá, ' + (nome.split(' ')[0] || 'motorista');
  try {
    const s = await api('sessao', token);
    enviadasHoje = s.enviadasHoje;
  } catch (e) {
    if (String(e.message).indexOf('SESSAO_EXPIRADA') >= 0) return sessaoExpirada();
  }
  pintarResumo();
}
function pintarResumo() {
  const pend = fila().length;
  $('resumo').textContent = enviadasHoje + ' enviadas hoje · ' + pend + (pend === 1 ? ' pendente' : ' pendentes') + (navigator.onLine ? '' : ' · sem internet');
}

/* ===================== LEITOR =====================
 * Câmera ao vivo: o motorista aponta e o app lê sozinho.
 * Plano B: "Usar foto" (lê o código numa foto, que é descartada) e "Digitar chave".
 */
// Leitor de imagens (usado na foto e como plano B da câmera ao vivo)
function novoScanner() {
  if (!scanner) {
    scanner = new Html5Qrcode('leitor-oculto', {
      formatsToSupport: [Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.QR_CODE],
      verbose: false,
    });
  }
  return scanner;
}

// Câmera ao vivo própria, na resolução cheia da câmera (o código do CT-e é longo e fino:
// em baixa resolução ele não é lido). Usa dois leitores juntos:
//  - leitor nativo do Android (BarcodeDetector), quando o aparelho suporta CODE-128;
//  - leitor ZXing (biblioteca), sempre, em recortes da área da mira.
let stream = null, video = null, loopAtivo = false, detectorNativo = null;
let cameras = [], cameraIdx = -1;
async function prepararDetectorNativo() {
  try {
    if (!('BarcodeDetector' in window)) return;
    const fmts = await BarcodeDetector.getSupportedFormats();
    if (fmts.indexOf('code_128') >= 0) detectorNativo = new BarcodeDetector({ formats: ['code_128', 'qr_code'] });
  } catch (e) { detectorNativo = null; }
}
const prontoNativo = prepararDetectorNativo();

async function listarCamerasTraseiras() {
  try {
    const todas = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    const tras = todas.filter(d => /back|rear|traseira|environment/i.test(d.label));
    cameras = tras.length ? tras : todas;
  } catch (e) { cameras = []; }
}

async function iniciarCamera() {
  erro('scan-erro'); $('manual').style.display = 'none';
  if (scannerRodando) return;
  await prontoNativo;
  try {
    const video_c = { width: { ideal: 1920 }, height: { ideal: 1080 } };
    if (cameraIdx >= 0 && cameras[cameraIdx]) video_c.deviceId = { exact: cameras[cameraIdx].deviceId };
    else video_c.facingMode = { ideal: 'environment' };
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: video_c });
    if (!video) {
      video = document.createElement('video');
      video.setAttribute('playsinline', ''); video.muted = true;
      video.style.width = '100%'; video.style.display = 'block';
      $('reader').innerHTML = '<div class="mira"></div>'; $('reader').prepend(video);
    }
    video.srcObject = stream; await video.play();
    await ajustarFoco();
    if (!cameras.length) { await listarCamerasTraseiras(); }
    $('btn-trocar').style.display = cameras.length > 1 ? '' : 'none';
    scannerRodando = true; loopAtivo = true;
    lerQuadros();
  } catch (e) {
    erro('scan-erro', 'Não foi possível abrir a câmera. Permita o acesso à câmera no navegador, ou use "Usar foto" / "Digitar chave".');
  }
}

// foco contínuo e um pouco de zoom: o celular fica mais longe do papel e consegue focar o código
async function ajustarFoco() {
  try {
    const track = stream.getVideoTracks()[0];
    const cap = track.getCapabilities ? track.getCapabilities() : {};
    const adv = {};
    if (cap.focusMode && cap.focusMode.indexOf('continuous') >= 0) adv.focusMode = 'continuous';
    if (cap.zoom) adv.zoom = Math.min(cap.zoom.max, Math.max(cap.zoom.min, 1.6));
    if (Object.keys(adv).length) await track.applyConstraints({ advanced: [adv] });
  } catch (e) {}
  mostrarDiagnostico();
}
function mostrarDiagnostico() {
  try {
    const st = stream.getVideoTracks()[0].getSettings();
    $('diag').textContent = (video.videoWidth || st.width) + '×' + (video.videoHeight || st.height) +
      ' · leitor ' + (detectorNativo ? 'nativo + ZXing' : 'ZXing') + (st.zoom ? ' · zoom ' + st.zoom.toFixed(1) + 'x' : '') +
      (cameras.length > 1 ? ' · câmera ' + (cameraIdx < 0 ? 'padrão' : (cameraIdx + 1) + '/' + cameras.length) : '');
  } catch (e) {}
}
async function pararCamera() {
  loopAtivo = false; scannerRodando = false; lanterna = false;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}
$('btn-trocar').onclick = async () => {
  if (!cameras.length) await listarCamerasTraseiras();
  if (!cameras.length) return;
  cameraIdx = (cameraIdx + 1) % cameras.length;
  await pararCamera(); await espera(200); iniciarCamera();
};
const espera = (ms) => new Promise(r => setTimeout(r, ms));
const RECORTES = [[0.9, 0.4], [1, 0.6], [0.75, 0.28]];   // largura x altura, a partir do centro (área da mira)
let quadro = 0;
async function lerQuadros() {
  const cv = document.createElement('canvas'), ctx = cv.getContext('2d', { willReadFrequently: true });
  while (loopAtivo) {
    if (video.readyState >= 2 && video.videoWidth) {
      try {
        const w = video.videoWidth, h = video.videoHeight;
        const [rw, rh] = RECORTES[(quadro++) % RECORTES.length];
        const cw = Math.round(w * rw), ch = Math.round(h * rh);
        cv.width = cw; cv.height = ch;
        ctx.drawImage(video, (w - cw) / 2, (h - ch) / 2, cw, ch, 0, 0, cw, ch);
        if (detectorNativo) {
          try { for (const c of await detectorNativo.detect(cv)) aoLer(c.rawValue); } catch (e) {}
        }
        if (!loopAtivo) break;
        if (!detectorNativo || quadro % 2 === 0) {   // ZXing sempre roda (a cada 2 quadros quando há o nativo)
          const blob = await new Promise(ok => cv.toBlob(ok, 'image/jpeg', 0.92));
          try { aoLer(await novoScanner().scanFile(new File([blob], 'q.jpg', { type: 'image/jpeg' }), false)); } catch (e) {}
        }
        if (quadro === 5) mostrarDiagnostico();
        await espera(60);
      } catch (e) { await espera(300); }
    } else { await espera(100); }
  }
}

let travado = false;
function aoLer(texto) {
  if (travado) return;
  const chave = extrairChave(texto);
  if (!chave) return;               // outro código qualquer: continua procurando
  travado = true;
  processarChave(chave);
  setTimeout(() => travado = false, 1500);
}
function processarChave(chave) {
  const v = validarChave(chave);
  if (!v.ok) { erro('scan-erro', v.erro); if (navigator.vibrate) navigator.vibrate([60, 60, 60]); return; }
  if (navigator.vibrate) navigator.vibrate(90);
  abrirOcorrencia(v);
}
$('btn-lanterna').onclick = async () => {
  try {
    lanterna = !lanterna;
    await stream.getVideoTracks()[0].applyConstraints({ advanced: [{ torch: lanterna }] });
  } catch (e) { lanterna = false; erro('scan-erro', 'Lanterna não disponível neste aparelho.'); }
};

// recorta (parte central), redimensiona e, se pedido, gira a foto — ajuda o leitor quando há
// fundo escuro em volta do papel, fotos muito grandes ou código de lado
function prepararImagem(bitmap, largura, girar, recorte) {
  const r = recorte || 1;
  const sw = bitmap.width * r, sh = bitmap.height * r, sx = (bitmap.width - sw) / 2, sy = (bitmap.height - sh) / 2;
  const esc = Math.min(1, largura / Math.max(sw, sh));
  const w = Math.round(sw * esc), h = Math.round(sh * esc);
  const cv = document.createElement('canvas');
  cv.width = girar ? h : w; cv.height = girar ? w : h;
  const ctx = cv.getContext('2d');
  if (girar) { ctx.translate(h, 0); ctx.rotate(Math.PI / 2); }
  ctx.drawImage(bitmap, sx, sy, sw, sh, 0, 0, w, h);
  return new Promise(ok => cv.toBlob(b => ok(new File([b], 'foto.jpg', { type: 'image/jpeg' })), 'image/jpeg', 0.92));
}

async function lerCodigoDaFoto(arquivo) {
  // 1) leitor nativo do Android (Chrome), rápido e lê em qualquer ângulo
  if ('BarcodeDetector' in window) {
    try {
      const det = new BarcodeDetector({ formats: ['code_128', 'qr_code'] });
      const bmp = await createImageBitmap(arquivo);
      for (const c of await det.detect(bmp)) { const ch = extrairChave(c.rawValue); if (ch) return ch; }
    } catch (e) {}
  }
  // 2) biblioteca de leitura, tentando a foto em tamanhos e posições diferentes
  const bmp = await createImageBitmap(arquivo);
  const tentativas = [
    () => prepararImagem(bmp, 1600, false, 1),    // foto inteira
    () => prepararImagem(bmp, 1600, false, 0.7),  // centro da foto
    () => prepararImagem(bmp, 1600, false, 0.45), // só o miolo (código enquadrado de perto)
    () => prepararImagem(bmp, 2400, false, 0.7),
    () => prepararImagem(bmp, 1600, true, 0.7),   // foto tirada de lado
    () => prepararImagem(bmp, 1600, true, 1),
  ];
  for (const t of tentativas) {
    try { const ch = extrairChave(await novoScanner().scanFile(await t(), false)); if (ch) return ch; } catch (e) {}
  }
  return null;
}

$('btn-foto').onclick = async () => { erro('scan-erro'); await pararCamera(); $('arq-foto').click(); };
$('arq-foto').onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return iniciarCamera();
  carregando(true);
  try {
    const chave = await lerCodigoDaFoto(f);
    if (!chave) { erro('scan-erro', 'Não foi possível ler o código na foto. Tente de novo, mais perto e sem reflexo.'); iniciarCamera(); }
    else { processarChave(chave); if (!$('t-oco').classList.contains('ativa')) iniciarCamera(); }
  } finally { carregando(false); }
};
$('btn-digitar').onclick = () => { $('manual').style.display = 'flex'; $('chave-manual').focus(); };
$('btn-usar-chave').onclick = () => {
  const ch = $('chave-manual').value.replace(/\D/g, '');
  $('chave-manual').value = '';
  processarChave(ch);
};

/* ===================== OCORRÊNCIA ===================== */
function abrirOcorrencia(v) {
  cteAtual = v; ocoSelecionada = null; gpsAtual = null;
  $('cte-titulo').textContent = 'CT-e ' + v.numero + ' · Série ' + v.serie;
  $('cte-sub').innerHTML = 'Emissão ' + v.mes + ' · <span class="tag">chave válida</span>';
  $('busca').value = ''; $('recebedor').value = '';
  erro('oco-erro'); $('dup-aviso').style.display = 'none';
  $('btn-enviar').disabled = true;
  pintarLista();
  mostrar('t-oco');
  capturarGps();
  verificarDuplicidade(v.chave);
}

const normalizar = (s) => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
function pintarLista() {
  const termo = normalizar($('busca').value.trim());
  const filtradas = !termo ? ocorrencias : ocorrencias.filter(o =>
    /^\d+$/.test(termo) ? o.c.indexOf(termo) === 0 || o.c === termo.padStart(2, '0')   // busca por número: "1", "01", "3"…
                        : normalizar(o.c + ' ' + o.d).indexOf(termo) >= 0);
  $('cnt').textContent = termo ? (filtradas.length + ' de ' + ocorrencias.length + ' ocorrências encontradas') : (ocorrencias.length + ' ocorrências');
  const lista = $('lista');
  lista.innerHTML = '';
  if (!ocorrencias.length) { lista.innerHTML = '<div class="vazio">Lista de ocorrências ainda não baixada. Conecte-se à internet uma vez.</div>'; return; }
  if (!filtradas.length) { lista.innerHTML = '<div class="vazio">Nenhuma ocorrência encontrada.</div>'; return; }
  filtradas.forEach(o => {
    const b = document.createElement('button');
    b.className = 'oc' + (ocoSelecionada && ocoSelecionada.c === o.c ? ' sel' : '');
    b.innerHTML = '<span class="r"></span><span class="cd"></span><span class="ds"></span>';
    b.querySelector('.cd').textContent = o.c;
    b.querySelector('.ds').textContent = o.d;
    b.onclick = () => { ocoSelecionada = o; $('btn-enviar').disabled = false; pintarLista(); };
    lista.appendChild(b);
  });
}
$('busca').addEventListener('input', pintarLista);
$('btn-limpar').onclick = () => { $('busca').value = ''; pintarLista(); $('busca').focus(); };
$('btn-cancelar').onclick = () => mostrar('t-scan');

function capturarGps() {
  try {
    navigator.geolocation.getCurrentPosition(
      (p) => { gpsAtual = { lat: p.coords.latitude, lng: p.coords.longitude, precisao: Math.round(p.coords.accuracy) }; },
      () => {}, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
  } catch (e) {}
}

async function verificarDuplicidade(chave) {
  const local = fila().find(i => i.chave === chave);
  if (local) return avisoDup('Este CT-e já foi registrado neste aparelho (' + local.ocorrencia + ') e aguarda envio.');
  if (!navigator.onLine) return;
  try {
    const ja = await api('consultarChave', token, chave);
    if (ja.length) avisoDup('Atenção: este CT-e já tem registro — ' + ja.map(b => b.ocorrencia + ' em ' + b.quando + ' (' + b.motorista + ')').join('; '));
  } catch (e) {}
}
function avisoDup(msg) { $('dup-aviso').textContent = msg; $('dup-aviso').style.display = 'block'; }

/* ===================== ENVIO + FILA OFFLINE ===================== */
const fila = () => ls.get(K.FILA, []);
const salvarFila = (f) => ls.set(K.FILA, f);
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() :
  'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));

$('btn-enviar').onclick = async () => {
  if (!ocoSelecionada) return;
  const item = {
    id: uuid(),
    chave: cteAtual.chave,
    ocorrencia: ocoSelecionada.c,
    ocorrenciaDesc: ocoSelecionada.d,
    recebedor: $('recebedor').value.trim(),
    registradoEm: new Date().toISOString(),
    lat: gpsAtual && gpsAtual.lat, lng: gpsAtual && gpsAtual.lng, precisao: gpsAtual && gpsAtual.precisao,
  };
  const f = fila(); f.push(item); salvarFila(f);    // 1º grava no aparelho
  carregando(true);
  const r = await enviarItem(item);                  // 2º tenta enviar
  carregando(false);
  mostrarFim(item, r);
};

async function enviarItem(item) {
  if (!token) return 'pendente';
  try {
    await api('registrarBaixa', token, item);
    salvarFila(fila().filter(i => i.id !== item.id));
    enviadasHoje++;
    return 'enviado';
  } catch (e) {
    if (String(e.message).indexOf('SESSAO_EXPIRADA') >= 0) { return 'sessao'; }
    if (erroDeRede(e)) return 'pendente';
    // erro de regra (ex.: duplicidade bloqueada): remove da fila e informa
    salvarFila(fila().filter(i => i.id !== item.id));
    item.erro = e.message;
    return 'recusado';
  }
}

let sincronizando = false;
async function sincronizar() {
  if (sincronizando || !token || !navigator.onLine) return;
  sincronizando = true;
  try {
    for (const item of fila()) {
      const r = await enviarItem(item);
      if (r === 'pendente') break;
      if (r === 'sessao') { sessaoExpirada(); break; }
    }
  } finally { sincronizando = false; if ($('t-scan').classList.contains('ativa')) pintarResumo(); }
}
window.addEventListener('online', sincronizar);
window.addEventListener('online', pintarResumo);
window.addEventListener('offline', pintarResumo);
setInterval(sincronizar, 30000);

function mostrarFim(item, r) {
  const ok = r === 'enviado', pend = r === 'pendente' || r === 'sessao';
  $('fim-icone').style.background = ok ? '#dcfce7' : pend ? '#fef3c7' : '#fee2e2';
  $('fim-icone').innerHTML = ok
    ? '<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="3"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
    : pend ? '<svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
           : '<svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="3"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  $('fim-titulo').textContent = ok ? 'Baixa enviada!' : pend ? 'Salvo no aparelho' : 'Baixa não aceita';
  const hora = new Date(item.registradoEm).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  $('fim-sub').textContent = ok ? 'Registrada às ' + hora + (item.lat ? ' com localização' : '')
                         : pend ? 'Será enviado automaticamente quando houver internet'
                                : item.erro;
  $('fim-cte').textContent = cteAtual.numero + ' · Série ' + cteAtual.serie;
  $('fim-oco').textContent = item.ocorrencia + ' - ' + item.ocorrenciaDesc;
  $('fim-status').innerHTML = ok ? '<span class="ok" style="background:#dcfce7;color:#166534">ENVIADO</span> &nbsp;aguardando SSW'
                            : pend ? '<span class="ok" style="background:#fef3c7;color:#92400e">PENDENTE</span> &nbsp;na fila do aparelho'
                                   : '<span class="ok" style="background:#fee2e2;color:#991b1b">RECUSADO</span>';
  mostrar('t-fim');
  if (r === 'sessao') setTimeout(sessaoExpirada, 1500);
}
$('btn-proximo').onclick = () => { pintarResumo(); mostrar('t-scan'); };

/* ===================== INÍCIO ===================== */
(async function iniciar() {
  if (!token) return mostrar('t-login');
  $('ola').textContent = 'Olá, ' + (ls.get(K.NOME, '').split(' ')[0] || 'motorista');
  pintarResumo();
  mostrar('t-scan');
  await carregarOcorrencias();
  if (token) { await atualizarResumo(); sincronizar(); }
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
